name: Find Preview for Check Run

# Finds the open PR and Cloudflare preview URL for a completed Cloudflare
# "Workers Builds: ..." check run, from either caller event:
#
# - check_run (completed): the build check from the event payload; the PR is
#   the open PR whose head is that commit.
# - pull_request (opened/reopened): the PR from the event payload; the build
#   check is the completed, successful "Workers Builds: ..." check on its head.
#   This covers a PR opened after its build already finished, when the
#   check_run event found no open PR. If the build is still running, this
#   skips; the check_run event handles it when the build completes.
#
# The URL is read directly from the build check's own output (no wait
# required), falling back to the bot's PR comment if it's ever missing from the
# check run output. Returns empty outputs if no matching PR or URL is found.

on:
  workflow_call:
    outputs:
      pr-number:
        description: >
          The open PR number whose head SHA matches this check run, or empty
          string if no matching PR was found.
        value: ${{ jobs.find-preview.outputs.pr-number }}
      preview-url:
        description: >
          The Cloudflare preview URL for this commit, or empty string if it
          could not be found in the check run output or PR comment.
        value: ${{ jobs.find-preview.outputs.preview-url }}
      head-sha:
        description: The head SHA of the PR / build check run.
        value: ${{ jobs.find-preview.outputs.head-sha }}
      check-run-id:
        description: ID of the in_progress check run created for this PR, or empty string.
        value: ${{ jobs.find-preview.outputs.check-run-id }}

jobs:
  find-preview:
    name: Find Preview for Check Run
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
      checks: write
    outputs:
      pr-number: ${{ steps.find.outputs.pr-number }}
      preview-url: ${{ steps.find.outputs.preview-url }}
      head-sha: ${{ steps.find.outputs.head-sha }}
      check-run-id: ${{ steps.create-check.outputs.check-run-id }}
    steps:
      - name: Find open PR and Cloudflare preview URL
        id: find
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const skip = (message) => {
              core.info(message);
              core.setOutput('pr-number', '');
              core.setOutput('preview-url', '');
            };

            let checkRun;
            let pr;
            if (context.eventName === 'pull_request') {
              pr = context.payload.pull_request;
              const prSha = pr.head.sha;
              core.setOutput('head-sha', prSha);
              const { data } = await github.rest.checks.listForRef({
                owner, repo, ref: prSha, per_page: 100,
              });
              checkRun = data.check_runs.find(c =>
                c.name.startsWith('Workers Builds:') &&
                c.status === 'completed' &&
                c.conclusion === 'success'
              );
              if (!checkRun) {
                return skip(`No successful Workers Builds check on ${prSha} yet; the check_run event runs E2E when the build completes.`);
              }
              if (data.check_runs.some(c => c.name === 'E2E Tests (Preview)')) {
                return skip(`E2E Tests (Preview) already exists on ${prSha}, skipping.`);
              }
            } else {
              checkRun = context.payload.check_run;
              if (!checkRun?.head_sha) {
                core.setOutput('head-sha', '');
                return skip('No check_run head_sha in event context, skipping.');
              }
              core.setOutput('head-sha', checkRun.head_sha);

              // Find open PR whose current head matches this commit.
              const { data: prs } = await github.rest.pulls.list({
                owner, repo, state: 'open', per_page: 100,
              });
              pr = prs.find(p => p.head.sha === checkRun.head_sha);
              if (!pr) {
                return skip(`No open PR found for check run SHA ${checkRun.head_sha}, skipping. If a PR is opened later, its pull_request event runs E2E.`);
              }
            }

            const sha = checkRun.head_sha;
            const shortSha = sha.substring(0, 7);
            core.info(`Found PR #${pr.number} for SHA ${sha}`);
            core.setOutput('pr-number', String(pr.number));

            // Primary: the completed check run's own output already contains
            // the preview URL (e.g. "Preview URL: https://...workers.dev"),
            // so read it directly from the event payload with no wait.
            const summary = checkRun.output?.summary || '';
            const summaryMatch = summary.match(/^Preview URL:\s*(\S+)/m);
            if (summaryMatch) {
              core.info(`Found preview URL in check run output: ${summaryMatch[1]}`);
              core.setOutput('preview-url', summaryMatch[1]);
              return;
            }

            // Fallback: in case Cloudflare ever omits the URL from the check
            // run output, retry briefly against the bot's PR comment instead.
            core.info('Preview URL not in check run output, falling back to PR comment search.');
            for (let attempt = 1; attempt <= 6; attempt++) {
              const { data: comments } = await github.rest.issues.listComments({
                owner, repo, issue_number: pr.number, per_page: 50,
              });
              const cfComment = comments.find(c =>
                c.user.login === 'cloudflare-workers-and-pages[bot]' &&
                c.body.includes(shortSha) &&
                c.body.includes('Commit Preview URL')
              );
              if (cfComment) {
                const urlMatch = cfComment.body.match(/<a href='(https:\/\/[^']+)'>Commit Preview URL<\/a>/);
                const url = urlMatch?.[1];
                if (url) {
                  core.info(`Found preview URL: ${url}`);
                  core.setOutput('preview-url', url);
                  return;
                }
              }
              if (attempt < 6) {
                core.info(`Attempt ${attempt}/6: Cloudflare comment not ready yet, waiting 10s...`);
                await new Promise(r => setTimeout(r, 10_000));
              }
            }
            core.warning(`Cloudflare preview URL not found for ${shortSha} after retries.`);
            core.setOutput('preview-url', '');

      - name: Create in-progress check run on PR
        id: create-check
        if: steps.find.outputs.preview-url != ''
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ steps.find.outputs.head-sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            // GITHUB_TOKEN cannot set details_url (GitHub overrides it), and this run executes
            // in main's context, so it does not appear on the PR. external_id + output are
            // writable, so they carry the link from the PR check back to this run.
            const { data: checkRun } = await github.rest.checks.create({
              owner,
              repo,
              name: 'E2E Tests (Preview)',
              head_sha: process.env.HEAD_SHA,
              status: 'in_progress',
              started_at: new Date().toISOString(),
              external_id: String(context.runId),
              output: {
                title: 'Running E2E tests against preview',
                summary: `Logs: [workflow run ${context.runId}](${runUrl})`,
              },
            });
            core.info(`Created check run ${checkRun.id} for ${process.env.HEAD_SHA}`);
            core.setOutput('check-run-id', String(checkRun.id));
