name: Find PR for Deployment

# Reads the deployment SHA from the caller's deployment_status event context
# and finds the open PR associated with it. Returns an empty pr-number if no
# matching open PR exists (e.g. production deploys from main).

on:
  workflow_call:
    outputs:
      pr-number:
        description: >
          The open PR number whose head SHA matches this deployment, or empty
          string if no matching PR was found.
        value: ${{ jobs.find-pr.outputs.pr-number }}

jobs:
  find-pr:
    name: Find PR for Deployment
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      pr-number: ${{ steps.find.outputs.pr-number }}
    steps:
      - name: Find open PR matching deployment SHA
        id: find
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.deployment?.sha;
            if (!sha) {
              core.info('No deployment SHA in event context, skipping.');
              core.setOutput('pr-number', '');
              return;
            }
            const { owner, repo } = context.repo;
            const { data: prs } = await github.rest.pulls.list({
              owner, repo, state: 'open', per_page: 100,
            });
            const pr = prs.find(p => p.head.sha === sha);
            if (!pr) {
              core.info(`No open PR found for deployment SHA ${sha}, skipping.`);
              core.setOutput('pr-number', '');
              return;
            }
            core.info(`Found PR #${pr.number} for deployment SHA ${sha}`);
            core.setOutput('pr-number', String(pr.number));
